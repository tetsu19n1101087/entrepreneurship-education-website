# supabase/migrations/ のマイグレーションを本番 Supabase に適用する。
# develop へのマージ（push）でマイグレーションが変わったときに自動で適用する。
# 手動実行（workflow_dispatch）は dry run での確認用。
# 手順は docs/supabase-migrations.md を参照。
name: Supabase migrate

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run（適用せずに、流れるマイグレーションだけを表示する）'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate (${{ inputs.dry_run && 'dry run' || 'apply' }})
    runs-on: ubuntu-latest
    # develop で動くので、Vercel の Preview と同じ GitHub environment を使う（DB は本番と共有）
    environment: Preview
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.121.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration history
        run: supabase migration list

      - name: Push migrations (dry run)
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run

      - name: Push migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push
